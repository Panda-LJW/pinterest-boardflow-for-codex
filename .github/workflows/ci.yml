name: CI

on:
  push:
    branches: [main, "codex/**", "claude/**"]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run type, MCP, and structure tests
        run: npm test

      - name: Verify committed runtime bundle is current
        if: matrix.os == 'ubuntu-latest'
        run: git diff --exit-code -- plugins/pinterest-reference-panel/dist/server.bundle.js
